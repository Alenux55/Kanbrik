name: kanbrik-local
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: kanbrik_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a disposable local password in .env}
      POSTGRES_DB: kanbrik_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kanbrik_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbrik_dev -d kanbrik_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://kanbrik_dev:${POSTGRES_PASSWORD}@db:5432/kanbrik_dev?schema=public
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      KANBRIK_ENV: production
      ENABLE_LOCAL_REGISTRATION: "false"
volumes:
  kanbrik_dev_data:
